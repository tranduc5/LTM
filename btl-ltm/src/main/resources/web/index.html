<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-room Chat</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login"><form id="loginForm">
  <h1>💬 Multi-room Chat</h1><p>Đăng nhập tài khoản để trò chuyện an toàn.</p>
  <div class="tabs"><button id="loginTab" type="button" class="selected">Đăng nhập</button><button id="registerTab" type="button">Đăng ký</button></div>
  <label for="nick">Tài khoản</label><input id="nick" maxlength="20" placeholder="Tên đăng nhập" autocomplete="username" required>
  <label for="password">Mật khẩu</label><input id="password" type="password" placeholder="Tối thiểu 8 ký tự" autocomplete="current-password" required>
  <button id="loginSubmit" type="submit">Đăng nhập</button><div id="loginErr" role="alert"></div>
</form></div>
<div id="app"><aside>
  <div class="account"><span id="myStatus" class="dot online"></span><strong id="myName"></strong><button id="logout" class="ghost">Thoát</button></div>
  <section><h2>Phòng chat <button class="ghost" id="newRoom" type="button">+ Phòng</button></h2><ul id="rooms"></ul></section>
  <section><h2>Tin nhắn riêng</h2><ul id="people"></ul></section>
  <section><h2>Trong phòng</h2><ul id="users"></ul></section>
</aside><main><header><div><strong id="roomTitle"># lobby</strong><div class="subheading" id="roomSubtitle">Phòng công khai</div></div><span id="me"></span></header>
<div id="log" role="log" aria-live="polite"></div>
<footer><form id="sendForm"><label for="file" class="attach" title="Gửi ảnh hoặc tệp">📎</label><input type="file" id="file" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.zip" hidden><input id="msg" placeholder="Nhập tin nhắn..." autocomplete="off" maxlength="4000"><button type="submit">Gửi</button></form><div class="hint" id="hint">Nhấp vào người dùng để mở chat riêng · Ảnh/PDF/TXT/ZIP tối đa 600 KB</div></footer>
</main></div><script src="app.js"></script></body></html>
